<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PURA SELVA | Sabores de la Amazonía</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient a1"></div><div class="ambient a2"></div>
<header class="hero">
  <div class="topbar">
    <button id="backBtn" class="ghost" hidden>← CATEGORÍAS</button>
    <button id="cartBtn" class="cartMini">🛒 <span>Ver pedido</span> <b id="cartCount">0</b></button>
  </div>
  <div class="brand">
    <img src="images/logo-pura-selva.png" alt="Pura Selva" class="logo">
    <div>SABORES DE LA AMAZONÍA</div>
  </div>
</header>
<main>
<section id="categories" class="view active">
  <div class="heading"><span>🌿</span><h1>Nuestra carta</h1><p>El sabor de la selva, directo a tu mesa</p></div>
  <div id="categoryGrid" class="categoryGrid"></div>
</section>
<section id="products" class="view">
  <div class="heading row"><div><span id="catIcon">🌿</span><h1 id="catTitle"></h1><p id="catSub"></p></div>
  <input id="search" type="search" placeholder="Buscar en esta categoría..."></div>
  <div id="productGrid" class="productGrid"></div>
</section>
</main>
<aside id="drawer" class="drawer">
  <div class="drawerHead"><div><small>TU PEDIDO</small><h2>Lo que elegiste</h2></div><button id="closeCart">✕</button></div>
  <div id="cartItems" class="cartItems"></div>
  <div class="drawerFoot"><div class="total"><span>Total</span><b id="cartTotal">S/ 0.00</b></div>
    <button id="clearCart" class="secondary">Vaciar pedido</button><button id="sendOrder" class="primary">Enviar pedido</button>
  </div>
</aside><div id="overlay" class="overlay"></div>
<script src="script.js"></script>
</body></html>
